directories:
  output: release
  buildResources: build
appId: com.floatfile.app
productName: FLOAT.FILE
files:
  - filter:
      - dist/**/*
      - electron/**/*
      - package.json
win:
  target:
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  legalTrademarks: FLOAT.FILE
portable:
  artifactName: FLOAT.FILE.exe
compression: maximum
electronLanguages:
  - en-US
asarUnpack:
  - node_modules/uiohook-napi/**
npmRebuild: false
electronVersion: 39.8.10
